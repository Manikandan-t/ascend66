:root{--bg:#1c1c1c;--bg2:#121212;--card:#252525;--card2:#2d2d2d;--line:#363636;--tile:#f0f0f0;--tsh:#a3a3a3;--or:#ff6a00;--ord:#b84b00;--tx:#fff;--mut:#8e8e8e;--gry:#3c3c3c;--gryd:#262626;--grn:#35d07f;--red:#ff4d4d;--yel:#ffd84d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font-family:Outfit,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;padding:0 18px 120px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.1}
h1{font-size:44px;font-weight:800}h2{font-size:24px}h3{font-size:18px;font-weight:600}
.mut{color:var(--mut);font-size:15px;line-height:1.4}.or{color:var(--or)}.grn{color:var(--grn)}.red{color:var(--red)}
.ic{display:inline-block;vertical-align:middle;flex:none}
.top{padding-top:max(26px,calc(env(safe-area-inset-top) + 18px))}
.bar0{position:sticky;top:0;z-index:15;margin:0 -18px 18px;padding:max(18px,calc(env(safe-area-inset-top) + 10px)) 18px 16px;background:var(--bg2);text-align:center}
.bar0 h2{font-size:30px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px}
.dash{background:var(--card);border:2px dashed #353535;border-radius:20px;padding:14px}
/* 3D light tile */
.t3{background:var(--tile);color:#141414;border-radius:16px;padding:16px;box-shadow:0 6px 0 var(--tsh)}
.t3.o{background:var(--or);color:#fff;box-shadow:0 6px 0 var(--ord)}
/* icon tile */
.it{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--gry);color:#bdbdbd;box-shadow:0 5px 0 #222;flex:none}
.it.on{background:var(--or);color:#fff;box-shadow:0 5px 0 var(--ord)}
.it.sm{width:46px;height:46px;border-radius:12px;box-shadow:0 4px 0 #1a1a1a}.it.sm.on{box-shadow:0 4px 0 var(--ord)}
.btn{font:inherit;font-size:17px;font-weight:700;color:#fff;background:var(--or);border:0;border-radius:16px;padding:16px 18px;margin:6px 0 12px;cursor:pointer;box-shadow:0 6px 0 var(--ord);text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ord)}
.btn.w{background:var(--tile);color:#141414;box-shadow:0 6px 0 var(--tsh)}.btn.w:active{box-shadow:0 2px 0 var(--tsh)}
.btn.g{background:var(--gry);box-shadow:0 6px 0 #1f1f1f}.btn.g:active{box-shadow:0 2px 0 #1f1f1f}
.btn.r{background:#e23b3b;box-shadow:0 6px 0 #8f1f1f}
.btn.full{width:100%;display:block}.btn.sm{font-size:14px;padding:10px 14px;border-radius:12px;margin:4px 0 8px}
.seg{display:flex;gap:10px;margin:18px 0}
.seg button{font:inherit;font-size:16px;font-weight:500;flex:1;padding:10px 6px;border:0;border-radius:10px;background:#2a2a2a;color:#8a8a8a;box-shadow:0 4px 0 #141414;cursor:pointer}
.seg button.on{background:var(--tile);color:#111;box-shadow:0 4px 0 var(--tsh)}
.pill{display:inline-flex;align-items:center;gap:3px;background:var(--or);color:#fff;border-radius:99px;padding:1px 9px;font-weight:700;font-size:17px;vertical-align:middle}
.t3.o .pill{background:#fff;color:var(--or)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#2a2a2a;border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px}
.pbar{height:6px;background:#d5d5d5;border-radius:9px;overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--or) 80%,#ffb27a);transition:width .5s}
.t3.o .pbar{background:#ffffff55}.t3.o .pbar i{background:linear-gradient(90deg,#fff 85%,#ffd1ad)}
.dbar{height:8px;background:#333;border-radius:9px;overflow:hidden;margin:8px 0}
.dbar i{display:block;height:100%;background:var(--or);border-radius:9px;transition:width .5s}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:#151515;border:2px solid var(--line);border-radius:14px;padding:13px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--or)}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{accent-color:var(--or);width:22px!important;height:22px;flex:none}
label.mut{display:block;margin:10px 0 6px;font-size:14px}
/* quests */
.q{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.q:active{transform:scale(.98)}
.q .nm{font-size:18px;font-weight:600}
.q.done{border-color:#4a2a12;background:#2a221c}
.q.done .nm{color:#cfcfcf}
.ck{margin-left:auto;width:34px;height:34px;border-radius:50%;border:3px solid #4a4a4a;display:grid;place-items:center;flex:none}
.done .ck{background:var(--or);border-color:var(--or)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);padding:12px 0 max(14px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:#5c5c5c;padding:6px 0;cursor:pointer}
nav button.on{color:#fff}
/* journey */
.jday{position:relative;padding-left:62px;padding-bottom:22px}
.jday::before{content:'';position:absolute;left:24px;top:56px;bottom:0;width:4px;background:var(--or);border-radius:4px}
.jday.fut::before{background:none;border-left:3px dashed #444;width:0}
.jday.last::before{display:none}
.jbadge{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--or);color:#fff;box-shadow:0 5px 0 var(--ord)}
.jbadge.p{background:#5a3412;box-shadow:0 5px 0 #2c1a09}.jbadge.n{background:#4a4a4a;box-shadow:0 5px 0 #2a2a2a}
.jhead{min-height:56px;margin-bottom:14px}.jhead .mut{font-size:15px}.jhead h2{font-size:34px;font-weight:700}
.jgap{position:relative;height:64px;margin-top:-22px}.jgap::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:4px;background:var(--or)}
.jgift{position:absolute;left:4px;top:10px;width:44px;height:44px;border-radius:50%;background:var(--bg);border:4px solid var(--or);display:grid;place-items:center;color:#fff;z-index:2;cursor:pointer}
.jgift.done{background:var(--or)}
.jgift.lock{border-color:#444;color:#555}
.jc{text-align:center;min-height:150px}
.jc h3{font-weight:500;font-size:17px;margin-bottom:12px}
.emo{font-size:26px;width:42px;height:42px;border-radius:50%;background:#333;display:inline-grid;place-items:center;margin:3px;cursor:pointer;filter:grayscale(.3)}
.emo.big{width:70px;height:70px;font-size:44px;background:var(--yel);box-shadow:0 0 0 4px #111;filter:none}
.paper{background:#f4f4f4;color:#222;border-radius:10px;padding:12px;text-align:left;font-size:12.5px;line-height:1.45;min-height:90px;cursor:pointer;box-shadow:0 4px 0 #9a9a9a;white-space:pre-wrap;overflow:hidden;max-height:130px}
.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:3px solid #111}
.fut .dash,.fut .jhead{opacity:.35}
/* misc */
.grid66{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:4px;background:#2e2e2e}.cell.f{background:var(--or)}.cell.p{background:#6a3a12}
.ach{text-align:center;padding:12px 4px;border-radius:14px;background:#262626;color:#555;font-size:12px;font-weight:600}
.ach.on{background:var(--tile);color:#141414;box-shadow:0 5px 0 var(--tsh)}.ach.on .ic{color:var(--or)}
.list .li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #2f2f2f;cursor:pointer}
.list .li:last-child{border:0}
.timer{font-size:76px;font-weight:800;text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:10px 0}
.breath{width:180px;height:180px;margin:24px auto;border-radius:50%;background:var(--or);display:grid;place-items:center;font-weight:700;font-size:18px;transition:transform 4s ease-in-out;box-shadow:0 0 0 16px #ff6a0026,0 0 0 32px #ff6a0012}
.overlay{position:fixed;inset:0;background:#0d0d0d;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.mid{align-items:center;padding:16px}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:22px 18px max(22px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.mid .sheet{border-radius:28px}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--tile);color:#141414;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;z-index:99;box-shadow:0 5px 0 var(--tsh);max-width:92vw;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-12px)}}
.pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{from{transform:scale(.7);opacity:0}}
.logo{width:34px;height:34px;border-radius:9px;background:var(--or);display:inline-grid;place-items:center;color:#fff;box-shadow:0 3px 0 var(--ord)}
</style>
</head>

/* ---------- core ---------- */
const hab=id=>S.habits.find(h=>h.id===id);
const amt=(k,id)=>(S.log[k]&&S.log[k][id])||0;
const isBool=h=>h.target<=1&&!h.unit;
const isDone=(k,h)=>amt(k,h.id)>=h.target;
const idsFor=k=>S.snap[k]||S.habits.map(h=>h.id);
function isPerfect(k){const hs=idsFor(k).map(hab).filter(Boolean);return hs.length>0&&hs.every(h=>isDone(k,h))}
const doneCount=k=>Object.keys(S.aw[k]||{}).length;
const dayNo=()=>Math.max(1,diff(S.start,dk())+1);
function streak(){let k=dk();if(!(isPerfect(k)||S.frozen[k]))k=addDays(k,-1);let n=0;while((isPerfect(k)||S.frozen[k])&&n<3000){n++;k=addDays(k,-1)}return n}
const level=()=>Math.floor(Math.sqrt(S.xp/50))+1;
const lvlBase=l=>50*(l-1)*(l-1);
function rankOf(){const l=level(),t=Math.min(5,Math.floor((l-1)/5));return RANKS[t]+' '+ROM[(l-1)%5]}
function rating(c,mode){const r0=(S.rate0&&S.rate0[c])||40;if(mode==='d1')return r0;if(mode==='pot')return Math.min(99,r0+60);return Math.min(99,r0+Math.floor((S.attr[c]||0)/30))}

function celebrate(i,t,s,extra=''){return `<div class="modal mid"><div class="sheet pop" style="text-align:center"><div class="it on" style="width:84px;height:84px;margin:6px auto 18px;border-radius:22px">${ic(i,46)}</div><h2 style="font-size:32px">${t}</h2><p class="mut">${s}</p>${extra}<button class="btn full" data-act="mclose">Continue</button></div></div>`}
function complete(h,k){
 const x=DIFF[h.diff||'med'].xp;S.aw[k]=S.aw[k]||{};S.aw[k][h.id]=x;
 gainXP(x);S.attr[h.cat]=(S.attr[h.cat]||0)+x;S.coins+=3;S.total++;buzz(25);toast('+'+x+' XP · '+h.cat);
 if(isPerfect(k)&&!S.perfect[k]){S.perfect[k]=1;gainXP(20);S.coins+=10;S.best=Math.max(S.best,streak());modal=celebrate('flame','All tasks done!','Day '+Math.min(dayNo(),S.span)+' complete · streak '+streak()+' 🔥','<p class="or" style="font-weight:700">+20 bonus XP · +10 coins</p>')}
}
function uncomplete(h,k){
 const x=(S.aw[k]&&S.aw[k][h.id])||0;if(S.aw[k])delete S.aw[k][h.id];
 gainXP(-x);S.attr[h.cat]=Math.max(0,(S.attr[h.cat]||0)-x);S.total=Math.max(0,S.total-1);S.coins=Math.max(0,S.coins-3);
 if(S.perfect[k]&&!isPerfect(k)){delete S.perfect[k];gainXP(-20);S.coins=Math.max(0,S.coins-10)}
}
function setAmt(id,v){const k=dk(),h=hab(id);if(!h)return;S.snap[k]=S.snap[k]||S.habits.map(x=>x.id);const was=isDone(k,h);S.log[k]=S.log[k]||{};S.log[k][id]=Math.max(0,Math.round(v*100)/100);const now=isDone(k,h);if(!was&&now)complete(h,k);else if(was&&!now)uncomplete(h,k)}
function processDays(){
 const t=dk();
 for(let k=S.checked||S.start;k<t;k=addDays(k,1)){
  if(k<S.start||!S.habits.length||isPerfect(k)||S.frozen[k])continue;

function settingsV(){return `<h1>Settings</h1><div class="card" style="margin-top:18px"><label class="mut">Name</label><input value="${esc(S.name)}" data-ch="sname"><label class="row" style="margin-top:16px;gap:12px"><input type="checkbox" ${S.hard?'checked':''} data-ch="hard"><span><b class="red">Hard Mode</b><br><span class="mut" style="font-size:13.5px">Miss a day → back to Day 1, −20% XP and a push-up penalty</span></span></label></div>
 <div class="card"><h3>Reminders</h3><p class="mut" style="font-size:13.5px">Daily reminder plus any per-task times. Android app only.</p><label class="row" style="gap:12px"><input type="checkbox" ${S.remind.on?'checked':''} data-ch="rem"> Daily reminder</label><input type="time" value="${S.remind.time}" data-ch="remt" style="margin-top:10px"><button class="btn full" style="margin-top:12px" data-act="sched">Apply reminders</button></div>
 <div class="card"><h3>Backup</h3><p class="mut" style="font-size:13.5px">Everything stays on this phone. Copy to back up, paste to restore.</p><textarea id="ex" readonly>${esc(JSON.stringify(Object.assign({},S,{media:{}})))}</textarea><button class="btn g full" style="margin-top:10px" data-act="copy">Copy backup (without photos)</button><textarea id="im" placeholder="Paste backup here" style="margin-top:10px"></textarea><button class="btn g full" style="margin-top:10px" data-act="imp">Restore</button></div>

function sheetHTML(h){const k=dk(),a=amt(k,h.id),st=h.target>=20?5:h.target>=5?1:.5;return `<div class="modal"><div class="sheet"><div class="row"><span class="it on">${ic(h.icon,28)}</span><div><h2>${esc(h.name)}</h2><div class="mut">Target ${h.target} ${esc(h.unit)} · logged ${a}</div></div></div><div class="row" style="margin:20px 0 6px"><button class="btn g" data-act="amtstep" data-v="-${st}" style="width:64px">−</button><input id="amt" type="number" step="any" value="${a}" style="text-align:center;font-size:24px;font-weight:700"><button class="btn g" data-act="amtstep" data-v="${st}" style="width:64px">+</button></div><p class="mut" style="font-size:13.5px">Did more than the target? Log the real amount.</p><button class="btn full" data-act="amtdone" data-v="${h.id}">Complete (${h.target} ${esc(h.unit)})</button><button class="btn w full" data-act="amtsave" data-v="${h.id}">Save amount</button><button class="btn g full" data-act="stuck" data-v="${h.id}">Stuck on this habit?</button></div></div>`}
function editHTML(){const h=edit;return `<div class="modal"><div class="sheet"><h2>${h.id?'Edit':'New'} task</h2><input id="en" placeholder="Task name" value="${esc(h.name)}" style="margin-top:14px"><div class="row wrap" style="gap:10px;margin:14px 0">${PICK.map(i=>`<span class="it sm ${h.icon===i?'on':''}" style="cursor:pointer" data-act="epick" data-v="${i}">${ic(i,22)}</span>`).join('')}</div><div class="g2"><div><label class="mut">Target (1 = check)</label><input id="et" type="number" step="any" value="${h.target}"></div><div><label class="mut">Unit</label><input id="eu" placeholder="min, L, pages" value="${esc(h.unit)}"></div><div><label class="mut">Attribute</label><select id="ec">${CK.map(c=>`<option ${h.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="mut">Difficulty</label><select id="ed">${Object.keys(DIFF).map(d=>`<option value="${d}" ${h.diff===d?'selected':''}>${DIFF[d].n}</option>`).join('')}</select></div></div><label class="mut">Reminder time (optional)</label><input id="etm" type="time" value="${h.time||''}"><div style="height:12px"></div><button class="btn full" data-act="esave">Save</button>${h.id?`<button class="btn r full" data-act="edel">Delete task</button>`:''}<button class="btn g full" data-act="eclose">Cancel</button></div></div>`}
function cardModal(c,q){return `<div class="modal mid"><div class="sheet pop"><div class="t3 o" style="text-align:center;padding:28px 18px"><div class="row" style="justify-content:center;gap:8px;font-weight:700">${ic(CATS[c].ic,22)} ${c}</div><div style="font-size:24px;font-weight:700;margin-top:14px;line-height:1.3">${esc(q)}</div></div><div style="height:20px"></div><button class="btn w full" data-act="collect" data-c="${c}" data-q="${esc(q)}">Collect card</button><button class="btn g full" data-act="mclose">Close</button></div></div>`}

/* ---------- onboarding ---------- */
const QUIZ=[['sleep','How many hours do you sleep?',[['lt6','Under 6 hours'],['6to7','6–7 hours'],['7p','7+ hours']]],['water','How much water do you drink?',[['lt1','Under 1 L'],['1to2','1–2 L'],['2p','2 L+']]],['ex','How often do you exercise?',[['never','Rarely'],['some','1–2× a week'],['often','3×+ a week']]],['screen','Daily screen time?',[['6p','6h+'],['3to6','3–6h'],['lt3','Under 3h']]],['mind','Do you meditate?',[['no','Never'],['yes','Sometimes']]],['read','Do you read regularly?',[['no','No'],['yes','Yes']]],['social','Comfortable speaking up?',[['no','Not really'],['yes','Yes']]],['smoke','Any habit you want to quit?',[['none','No'],['smoke','Smoking / vaping'],['junk','Junk food'],['scroll','Doom-scrolling']]]];
function buildProgram(a){
 const wt=a.water==='lt1'?2:a.water==='1to2'?2.5:3,ex=a.ex==='never'?15:a.ex==='some'?30:45,sc=a.screen==='6p'?5:a.screen==='3to6'?3:2;
 const p=[{icon:'sleep',name:a.sleep==='lt6'?'Sleep 7 hours':'Sleep by 11pm',cat:'Discipline',target:1,unit:'',diff:'med'},{icon:'drop',name:'Drink water',cat:'Strength',target:wt,unit:'L',diff:'easy'},{icon:'run',name:'Exercise',cat:'Strength',target:ex,unit:'min',diff:ex>=45?'hard':'med'},{icon:'sunrise',name:'Wake up early',cat:'Discipline',target:1,unit:'',diff:'med'},{icon:'phone',name:'Screen time under '+sc+'h',cat:'Focus',target:1,unit:'',diff:'hard'},{icon:'lotus',name:'Meditate',cat:'Focus',target:a.mind==='no'?5:10,unit:'min',diff:'easy'},{icon:'book',name:'Read',cat:'Wisdom',target:10,unit:'pages',diff:'easy'},{icon:'shower',name:'Cold shower',cat:'Discipline',target:1,unit:'',diff:'med'},{icon:'pen',name:'Gratitude journal',cat:'Wisdom',target:1,unit:'',diff:'easy'},{icon:'chat',name:'Talk to someone new',cat:'Confidence',target:1,unit:'',diff:'med'}];
 if(a.smoke==='smoke')p.splice(4,0,{icon:'smoke',name:'No smoking',cat:'Discipline',target:1,unit:'',diff:'hard'});
 if(a.smoke==='junk')p.splice(4,0,{icon:'apple',name:'No junk food',cat:'Discipline',target:1,unit:'',diff:'med'});
 if(a.smoke==='scroll')p.splice(4,0,{icon:'prohibit',name:'No social media before noon',cat:'Focus',target:1,unit:'',diff:'hard'});
 return p.map(x=>Object.assign({id:uid(),time:''},x));
}
function assess(a){const sc=v=>Math.max(1,Math.min(5,v));return{Strength:sc((a.ex==='often'?4:a.ex==='some'?3:1)+(a.water==='2p'?1:0)),Wisdom:a.read==='yes'?4:2,Confidence:a.social==='yes'?4:2,Discipline:sc((a.sleep==='7p'?4:a.sleep==='6to7'?3:2)-(a.smoke&&a.smoke!=='none'?1:0)),Focus:sc((a.screen==='lt3'?3:a.screen==='3to6'?2:1)+(a.mind==='yes'?2:0))}}
const toRate=v=>18+v*9;
function onboard(){
 const wrap=x=>`<div class="top"></div>${x}`;
 if(ob.step===0)return wrap(`<div style="text-align:center;padding-top:40px"><span class="it on" style="width:96px;height:96px;border-radius:26px;margin:0 auto">${ic('flame',54)}</span><h1 style="margin:28px 0 12px">Transform your life in 66 days</h1><p class="mut" style="font-size:17px">Turn your goals into daily tasks, XP and streaks. Free, offline, no account.</p></div><div style="height:30px"></div><input id="nm" placeholder="Your name" value="${esc(S.name)}"><div style="height:14px"></div><button class="btn full" data-act="ob0">Get started</button>`);
 if(ob.step===1){const q=QUIZ.find(x=>!ob.a[x[0]]);if(!q){ob.step=2;return onboard()}const n=Object.keys(ob.a).length;return wrap(`<div class="mut" style="font-weight:600">${n+1} / ${QUIZ.length}</div>${pb(n/QUIZ.length*100,'dbar')}<h1 style="font-size:34px;margin:24px 0">${q[1]}</h1>${q[2].map(o=>`<button class="btn w full" data-act="oa" data-k="${q[0]}" data-v="${o[0]}" style="text-align:left">${o[1]}</button>`).join('')}`)}
 if(ob.step===2){const sc=assess(ob.a),r={};CK.forEach(c=>r[c]=toRate(sc[c]));const ov=Math.round(CK.reduce((a,c)=>a+r[c],0)/5);const w=CK.slice().sort((x,y)=>r[x]-r[y])[0],s=CK.slice().sort((x,y)=>r[y]-r[x])[0];
  return wrap(`<h1>Your Day 1 rating</h1><p class="mut" style="font-size:17px;margin:12px 0 20px">This is where you start. Strength: <b class="grn">${s}</b> · Blind spot: <b class="red">${w}</b></p><div class="g2"><div class="t3 o"><div class="row" style="gap:8px;font-weight:600">${ic('sparkle',20)} Overall</div><div style="font-size:40px;font-weight:800">${ov}</div>${pb(ov)}</div>${CK.map(c=>`<div class="t3"><div class="row" style="gap:8px;font-weight:600">${ic(CATS[c].ic,20)} ${c}</div><div style="font-size:40px;font-weight:800">${r[c]}</div>${pb(r[c])}</div>`).join('')}</div><div style="height:24px"></div><button class="btn full" data-act="ob2">Build my 66-day program</button>`)}
 ob.prog=ob.prog.length?ob.prog:buildProgram(ob.a);if(!ob.touched&&!ob.sel.length)ob.sel=ob.prog.slice(0,6).map(p=>p.id);
 return wrap(`<h1 style="font-size:36px">Your program</h1><p class="mut" style="margin:10px 0 18px">Tap to choose your daily tasks. You can change them anytime.</p>${ob.prog.map(p=>{const on=ob.sel.includes(p.id);return`<div class="q ${on?'done':''}" data-act="osel" data-v="${p.id}"><span class="it ${on?'on':''}">${ic(p.icon,26)}</span><div style="flex:1"><div class="nm">${esc(p.name)}${isBool(p)?'':' · '+p.target+' '+p.unit}</div><div class="mut" style="font-size:13.5px">${p.cat} · ${DIFF[p.diff].n}</div></div><span class="ck">${on?ic('check',18):''}</span></div>`}).join('')}<label class="row card" style="gap:12px"><input type="checkbox" id="hm"><span><b class="red">Hard Mode</b><br><span class="mut" style="font-size:13.5px">Miss a day and you restart at Day 1</span></span></label><button class="btn full" data-act="obgo">Start Day 1</button>`);
}

/* ---------- events ---------- */
function dailyCard(){const c=CK[Math.floor(Math.random()*CK.length)];return cardModal(c,CARDS[c][Math.floor(Math.random()*CARDS[c].length)])}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,v=el.dataset.v,k=dk();
 if(a==='ob0'){S.name=($('#nm').value||'').trim();ob.step=1}
 else if(a==='oa'){ob.a[el.dataset.k]=v}
 else if(a==='ob2'){const sc=assess(ob.a);S.rate0={};CK.forEach(c=>S.rate0[c]=toRate(sc[c]));ob.step=3}
 else if(a==='osel'){ob.touched=1;ob.sel=ob.sel.includes(v)?ob.sel.filter(x=>x!==v):[...ob.sel,v]}
 else if(a==='obgo'){if(!ob.sel.length){toast('Pick at least one task');return}S.habits=ob.prog.filter(p=>ob.sel.includes(p.id));S.hard=$('#hm').checked;S.start=dk();S.checked=dk();S.onboarded=true;S.tab='today';S.lastCard=dk();modal=dailyCard();sched()}
 else if(a==='tab'){S.tab=v;S.tool='';S.sub='';modal='';S._jScrolled=0;window.scrollTo(0,0)}
 else if(a==='rtab'){S.rtab=v}
 else if(a==='tool'){if(v==='lock'){modal=`<div class="modal"><div class="sheet"><h2>Screen Blocker</h2><p class="mut">Lock this screen for a set time. Finish for +1 XP per minute.</p>${[15,30,60].map(m=>`<button class="btn w full" data-act="lockgo" data-v="${m}">${m} minutes</button>`).join('')}<button class="btn g full" data-act="mclose">Cancel</button></div></div>`}else{S.tool=v;window.scrollTo(0,0)}}
 else if(a==='sub'){S.sub=v;window.scrollTo(0,0)}
 else if(a==='q'){const h=hab(v);if(isBool(h))setAmt(v,isDone(k,h)?0:1);else modal=sheetHTML(h)}
 else if(a==='pen'){S.penalty=false;gainXP(10);toast('Penalty cleared +10 XP')}
 else if(a==='mclose'){modal=''}
 else if(a==='amtstep'){const i=$('#amt');i.value=Math.max(0,(+i.value||0)+ +v);return}
 else if(a==='amtdone'){modal='';setAmt(v,hab(v).target)}
 else if(a==='amtsave'){const x=+$('#amt').value||0;modal='';setAmt(v,x)}
 else if(a==='stuck'){modal=`<div class="modal"><div class="sheet"><h2>Stuck on a habit?</h2>${TIPS.map(t=>`<p class="mut" style="font-size:16px">• ${t}</p>`).join('')}<button class="btn full" data-act="easier" data-v="${v}">Make it easier (halve target)</button><button class="btn g full" data-act="mclose">Close</button></div></div>`}
 else if(a==='easier'){const h=hab(v);if(h.target>1)h.target=Math.max(1,Math.round(h.target/2*10)/10);toast('Target lowered');modal=''}
 else if(a==='extend'){S.span+=66;toast('Program extended +66 days')}
 else if(a==='mood'){S.mood[k]=+v;gainXP(2)}
 else if(a==='moodclr'){delete S.mood[k]}
 else if(a==='phadd'){$('#fileIn').click();return}
 else if(a==='phview'){const u=S.media[el.dataset.k][+v];modal=`<div class="modal mid" data-act="mclose"><div style="max-width:520px;width:100%"><img src="${u}" style="width:100%;border-radius:20px"><div class="row" style="margin-top:14px"><button class="btn g" style="flex:1" data-act="mclose">Close</button>${el.dataset.k===k?`<button class="btn r" style="flex:1" data-act="phdel" data-v="${v}">Delete</button>`:''}</div></div></div>`}
 else if(a==='phdel'){S.media[k].splice(+v,1);modal=''}
 else if(a==='jedit'){modal=`<div class="modal"><div class="sheet"><h2>Your text journey</h2><p class="mut">3 things I am grateful for, how today went, what I'll improve…</p><textarea id="jt" style="min-height:200px">${esc(S.journal[k]||'')}</textarea><div style="height:10px"></div><button class="btn full" data-act="jsave">Save</button><button class="btn g full" data-act="mclose">Cancel</button></div></div>`}
 else if(a==='jsave'){const t=$('#jt').value.trim(),had=!!S.journal[k];S.journal[k]=t;modal='';if(t&&!had){gainXP(5);S.attr.Wisdom+=5;toast('Journal saved +5 XP')}}
 else if(a==='gift'){const g=+v;if(S.gifts[g]){toast('Already opened');return}if(dayNo()<=g){toast('Unlocks after Day '+g);return}S.gifts[g]=k;const c=25+g;S.coins+=c;gainXP(50);if(!modal)modal=celebrate('gift','Day '+g+' reward!','You kept going for '+g+' days.','<p class="or" style="font-weight:700">+50 XP · +'+c+' coins</p>')}
 else if(a==='draw'){modal=dailyCard()}
 else if(a==='collect'){const c=el.dataset.c,q=el.dataset.q;if(!S.cards.some(x=>x.q===q))S.cards.push({c,q});modal='';toast('Card collected')}
 else if(a==='tmins'){if(tState.run)return;tState.mins=+v;tState.left=+v*60}
 else if(a==='tgo'){if(tState.run){tState.run=false;clearInterval(timer)}else{tState.run=true;tState.end=Date.now()+tState.left*1000;timer=setInterval(tick,500)}}
 else if(a==='trst'){tState.run=false;clearInterval(timer);tState.left=tState.mins*60}
 else if(a==='bgo'){breath={left:+v*60,m:+v,t:0};bloop()}
 else if(a==='bstop'){clearInterval(breath.iv);breath=null}
 else if(a==='lockgo'){modal='';lockStart(+v);return}
 else if(a==='lockend'){clearInterval(lock.iv);lock=null;const o=$('#lockov');o&&o.remove()}
 else if(a==='wstart'){wk={id:v,done:{}}}
 else if(a==='wset'){wk.done[v]=!wk.done[v]}
 else if(a==='wcancel'){wk=null}
 else if(a==='wfin'){const r=S.routines.find(x=>x.id===wk.id),n=Object.values(wk.done).filter(Boolean).length;wk=null;S.counts.wk++;gainXP(30);S.attr.Strength+=30;S.wlog.push({d:k,r:r.name,sets:n});toast('Workout done +30 XP')}
 else if(a==='wdel'){S.routines=S.routines.filter(r=>r.id!==v)}
 else if(a==='wmove'){const n=$('#mn').value.trim(),s=+$('#ms').value||3;if(n){newMoves.push({n,s});$('#mn').value='';$('#rmoves').textContent=newMoves.map(m=>m.n+' ×'+m.s).join(', ')}return}
 else if(a==='wsave'){const n=$('#rn').value.trim();if(!n||!newMoves.length){toast('Add a name and moves');return}S.routines.push({id:uid(),name:n,moves:newMoves});newMoves=[]}
 else if(a==='cadd'){const n=$('#cn').value.trim(),c=+$('#ck').value;if(!n||!c)return;(S.cal[k]=S.cal[k]||[]).push({n,k:c})}
 else if(a==='cdel'){S.cal[k].splice(+v,1)}
 else if(a==='badd'){const t=$('#bt1').value.trim();if(!t)return;S.books.unshift({t,n:$('#bn').value.trim()});gainXP(5);S.attr.Wisdom+=5}
 else if(a==='bdel'){S.books.splice(+v,1)}

 else if(a==='hnew'){edit={id:'',icon:'sparkle',name:'',cat:'Discipline',target:1,unit:'',diff:'med',time:''};modal=editHTML()}

 else if(a==='edel'){S.habits=S.habits.filter(h=>h.id!==edit.id);edit=null;modal=''}
 else if(a==='eclose'){edit=null;modal=''}
 else if(a==='sched'){sched().then(r=>toast(r==='ok'?'Reminders set':r==='web'?'Reminders work in the Android app':'Allow notifications in phone settings'));return}
 else if(a==='copy'){const t=$('#ex');t.select();try{navigator.clipboard.writeText(t.value);toast('Copied')}catch(x){}return}
 else if(a==='imp'){try{const o=JSON.parse($('#im').value);S=Object.assign(fresh(),o);load2();toast('Restored')}catch(x){toast('Invalid backup');return}}
 else if(a==='reset'){modal=`<div class="modal mid"><div class="sheet"><h2>Erase everything?</h2><p class="mut">This cannot be undone.</p><button class="btn r full" data-act="reset2">Erase</button><button class="btn g full" data-act="mclose">Cancel</button></div></div>`}
 else if(a==='reset2'){S=fresh();ob={step:0,a:{},sel:[],prog:[]};modal=''}
 checkAch();save();render();
});
function load2(){S.habits.forEach(h=>{if(!ICONS[h.icon])h.icon=OLDIC[h.icon]||'sparkle'})}
function syncEdit(){if(!edit)return;edit.name=$('#en').value.trim();edit.target=+$('#et').value||1;edit.unit=$('#eu').value.trim();edit.cat=$('#ec').value;edit.diff=$('#ed').value;edit.time=$('#etm').value}
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fileIn'){const f=el.files&&el.files[0];el.value='';if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=480,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const k=dk();(S.media[k]=S.media[k]||[]).push(c.toDataURL('image/jpeg',.72));gainXP(3);checkAch();save();render()};im.src=r.result};r.readAsDataURL(f);return}
 const c=el.dataset.ch;if(!c)return;
 if(c==='cgoal')S.calGoal=+el.value||2200;else if(c==='sname')S.name=el.value.trim();else if(c==='hard')S.hard=el.checked;else if(c==='rem')S.remind.on=el.checked;else if(c==='remt')S.remind.time=el.value||'08:00';
 save();if(c==='cgoal')render();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){processDays();render()}});
if(S.onboarded&&S.lastCard!==dk()){S.lastCard=dk();modal=dailyCard();save()}
try{if('serviceWorker' in navigator&&!window.Capacitor&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();
</script>
