:root{--bg:#07080f;--panel:#11131f;--panel2:#171a2a;--edge:#262a40;--tx:#f3f4fb;--mut:#8a8fa8;--acc:#6c5cff;--acc2:#3fa9ff;--gold:#ffc542;--grn:#2ee59d;--red:#ff4d6d;--cyn:#4dd2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1e1a4a 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px;padding-top:max(16px,env(safe-area-inset-top))}
h1,h2,h3,.pf{margin:0;line-height:1.3;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}h2{font-size:18px;font-weight:750}h3{font-size:16px;font-weight:700}
.pf{font-size:13px;font-weight:700}.mut{color:var(--mut);font-size:13px;line-height:1.45}.gold{color:var(--gold)}.grn{color:var(--grn)}.red{color:var(--red)}
.ic{display:inline-block;vertical-align:middle;flex:none}
.px{background:linear-gradient(180deg,#151829,#10121e);border:1px solid var(--edge);border-radius:20px;margin:0 0 14px;padding:16px;position:relative}
.px.hl{border-color:#3b3580;background:linear-gradient(160deg,#1d1a45 0%,#121427 55%,#0f111c 100%);box-shadow:0 10px 40px -12px #6c5cff55}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:8px}
.btn{font:inherit;font-size:14px;font-weight:700;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,var(--acc),#8f5cff);border:0;border-radius:14px;margin:4px 0;padding:13px 16px;cursor:pointer;text-align:center;box-shadow:0 6px 18px -6px #6c5cffaa;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn.g{background:#1f2236;box-shadow:none;color:#d8dbf0;border:1px solid var(--edge)}.btn.r{background:linear-gradient(135deg,#ff4d6d,#d6336c);box-shadow:0 6px 18px -6px #ff4d6d99}.btn.y{background:linear-gradient(135deg,#ffc542,#ff9f1c);color:#2a1800;box-shadow:0 6px 18px -6px #ffb02e99}.btn.k{background:linear-gradient(135deg,#2ee59d,#14b87a);color:#032b1b;box-shadow:0 6px 18px -6px #2ee59d88}.btn.full{width:100%;display:block}
input,select,textarea{font:inherit;font-size:15px;color:var(--tx);background:#0b0d17;border:1px solid var(--edge);border-radius:12px;padding:12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{accent-color:var(--acc);width:20px!important;height:20px}
.bar{height:8px;background:#1f2236;border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,linear-gradient(90deg,var(--acc),var(--acc2)));transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px var(--c,#6c5cff)}
.quest{display:flex;align-items:center;gap:14px;padding:14px;margin:0 0 10px;background:var(--panel2);border:1px solid var(--edge);border-radius:18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s,background .2s}
.quest:active{transform:scale(.985)}
.quest .bd{position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--dc)}
.quest .icb{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,#0b0d17)}
.quest .nm{font-weight:650;font-size:15.5px}
.quest.done{background:linear-gradient(135deg,#0f2a22,#11201c);border-color:#1f5c46}.quest.done .nm{opacity:.6;text-decoration:line-through}
.chk{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2px solid #3a3f5c;display:grid;place-items:center;font-size:15px;font-weight:900;color:#032b1b;flex:none;transition:all .2s}
.done .chk{background:var(--grn);border-color:var(--grn);box-shadow:0 0 14px #2ee59d88}
nav{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:center}
nav div{display:flex;max-width:496px;width:100%;background:#12142299;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--edge);border-radius:24px;padding:6px}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:8px 0;border-radius:18px;cursor:pointer}
nav button .ic{display:block;margin:0 auto 4px}
nav button.on{color:#fff;background:linear-gradient(135deg,#6c5cff33,#3fa9ff22)}
nav button.on .ic{color:var(--acc2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;margin:0 6px 8px 0;background:#1a1d2e;border:1px solid var(--edge);border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--acc),#8f5cff);border-color:transparent}
.grid{display:grid;gap:5px}.g11{grid-template-columns:repeat(11,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr);gap:10px}
.cell{aspect-ratio:1;background:#1a1d2e;border-radius:4px}.cell.f{background:var(--grn);box-shadow:0 0 6px #2ee59d66}.cell.p{background:#1e6a50}
.ach{text-align:center;padding:12px 4px;background:#12142099;border:1px solid var(--edge);border-radius:16px;opacity:.38;font-size:11px;font-weight:600;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;color:var(--gold);border-color:#6b5520;background:linear-gradient(160deg,#2a2210,#141320)}
.stat{flex:1;text-align:center;background:var(--panel2);border:1px solid var(--edge);border-radius:16px;padding:12px 4px}
.stat b{display:block;font-size:22px;font-weight:800;margin-bottom:2px;background:linear-gradient(135deg,#fff,#b9b3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.timer{font-size:64px;font-weight:800;text-align:center;margin:14px 0;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.breath{width:170px;height:170px;margin:22px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8f7dff,#5a3dff 55%,#2b1d8f);display:grid;place-items:center;font-weight:700;font-size:14px;transition:transform 4s ease-in-out;box-shadow:0 0 60px #6c5cff88,0 0 0 14px #6c5cff1a,0 0 0 28px #6c5cff0d}
.overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#1b1745,#05060b 70%);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.modal{position:fixed;inset:0;background:#02030899;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal.mid{align-items:center}
.modal>.px{max-width:440px;width:100%;margin-bottom:max(12px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto;border-radius:26px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1d1a45ee;backdrop-filter:blur(10px);border:1px solid #3b3580;color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:99;text-align:center;max-width:92vw;box-shadow:0 10px 30px -10px #6c5cff;animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.bounce{animation:bn 2.4s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-6px)}}
.av{border-radius:50%;display:grid;place-items:center;position:relative;flex:none;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ac) 55%,#fff 0%),color-mix(in srgb,var(--ac) 35%,#0b0d17));box-shadow:0 0 0 3px #0b0d17,0 0 0 5px var(--ac),0 0 28px color-mix(in srgb,var(--ac) 60%,transparent);color:#fff}
</style>
</head>

/* ---------- core logic ---------- */
const hab=id=>S.habits.find(h=>h.id===id);
const amt=(k,id)=>(S.log[k]&&S.log[k][id])||0;
const isBool=h=>h.target<=1&&!h.unit;
const isDone=(k,h)=>amt(k,h.id)>=h.target;
function idsFor(k){return S.snap[k]||S.habits.map(h=>h.id)}
function isPerfect(k){const hs=idsFor(k).map(hab).filter(Boolean);return hs.length>0&&hs.every(h=>isDone(k,h))}
const allDone=k=>isPerfect(k);
const dayNo=()=>Math.max(1,diff(S.start,dk())+1);
function streak(){let k=dk();if(!(isPerfect(k)||S.frozen[k]))k=addDays(k,-1);let n=0;while((isPerfect(k)||S.frozen[k])&&n<3000){n++;k=addDays(k,-1)}return n}
const level=()=>Math.floor(Math.sqrt(S.xp/50))+1;
const lvlBase=l=>50*(l-1)*(l-1);
function rankOf(){const l=level(),t=Math.min(5,Math.floor((l-1)/5));return RANKS[t]+' '+ROM[(l-1)%5]}
function topCat(){let b='Discipline',v=-1;for(const c in S.attr)if(S.attr[c]>v){v=S.attr[c];b=c}return b}
const className=()=>S.xp?CATS[topCat()].cls:'Rookie';
let toasts=[];
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
let modal='';
function gainXP(n){const l0=level();S.xp=Math.max(0,S.xp+n);if(level()>l0&&n>0){buzz([60,40,60]);modal=`<div class="modal mid"><div class="px hl pop" style="text-align:center"><div class="bounce">${ic('star-medal',64,'color:var(--gold)')}</div><h1 class="gold" style="margin:12px 0">LEVEL UP!</h1><h2>Level ${level()}</h2><p class="mut">${rankOf()} · ${className()}</p><button class="btn full" data-act="mclose">NICE</button></div></div>`}}
function complete(h,k){
 const x=DIFF[h.diff||'med'].xp;S.aw[k]=S.aw[k]||{};S.aw[k][h.id]=x;
 gainXP(x);S.attr[h.cat]=(S.attr[h.cat]||0)+x;S.coins+=3;S.total++;buzz(30);
 if(Math.random()<.35){const l=LOOT[Math.floor(Math.random()*LOOT.length)];S.loot[l[0]]=(S.loot[l[0]]||0)+1;S.coins+=5;toast('LOOT: '+l[0]+' +5 coins')}else toast('+'+x+' XP · +3 coins');
 if(isPerfect(k)&&!S.perfect[k]){S.perfect[k]=1;gainXP(20);S.coins+=10;S.best=Math.max(S.best,streak());
  let d=null;for(const m of DUN){if(dayNo()>=m[0]&&!S.dun[m[0]]){d=m;break}}
  if(d){S.dun[d[0]]=k;gainXP(100);S.coins+=50}
  modal=`<div class="modal mid"><div class="px hl pop" style="text-align:center">${ic(d?d[2]:'trophy',64,'color:var(--gold)')}<h1 class="gold" style="margin:12px 0">${d?'DUNGEON CLEARED!':'QUESTS CLEAR!'}</h1>${d?`<h3>${esc(d[1])}</h3><br>`:''}<p class="mut">All daily quests complete</p><p class="gold pf">+20 XP BONUS${d?' · +100 XP · +50 COINS':' · +10 COINS'}</p><p class="mut">🔥 Streak: ${streak()} days</p><button class="btn full" data-act="mclose">CONTINUE</button></div></div>`}
}
function uncomplete(h,k){
 const x=(S.aw[k]&&S.aw[k][h.id])||0;if(S.aw[k])delete S.aw[k][h.id];
 gainXP(-x);S.attr[h.cat]=Math.max(0,(S.attr[h.cat]||0)-x);S.total=Math.max(0,S.total-1);S.coins=Math.max(0,S.coins-3);
 if(S.perfect[k]&&!isPerfect(k)){delete S.perfect[k];gainXP(-20);S.coins=Math.max(0,S.coins-10)}
}
function setAmt(id,v){
 const k=dk(),h=hab(id);if(!h)return;S.snap[k]=S.snap[k]||S.habits.map(x=>x.id);
 const was=isDone(k,h);S.log[k]=S.log[k]||{};S.log[k][id]=Math.max(0,Math.round(v*100)/100);
 const now=isDone(k,h);if(!was&&now)complete(h,k);else if(was&&!now)uncomplete(h,k);
}
function processDays(){
 const t=dk();let msg=[];
 for(let k=S.checked||S.start;k<t;k=addDays(k,1)){
  if(k<S.start||!S.habits.length)continue;if(isPerfect(k)||S.frozen[k])continue;
  if(S.freezes>0){S.freezes--;S.frozen[k]=1;msg.push('Streak Freeze used')}
  else if(S.hard){const loss=Math.floor(S.xp*.2);S.xp-=loss;S.start=t;S.resets++;S.penalty=true;S.dun={};msg.push('HARD MODE: missed a day. Back to Day 1, -'+loss+' XP');break}
 }
 S.checked=t;save();msg.forEach(m=>setTimeout(()=>toast(m),500));
}

/* ---------- onboarding ---------- */
const QUIZ=[['sleep','How do you sleep?',[['lt6','Under 6 hours'],['6to7','6–7 hours'],['7p','7+ hours']]],['water','Water per day?',[['lt1','Under 1 L'],['1to2','1–2 L'],['2p','2 L+']]],['ex','How often do you exercise?',[['never','Rarely'],['some','1–2× a week'],['often','3×+ a week']]],['screen','Daily screen time?',[['6p','6h+'],['3to6','3–6h'],['lt3','Under 3h']]],['mind','Do you meditate?',[['no','Never'],['yes','Sometimes']]],['read','Do you read regularly?',[['no','No'],['yes','Yes']]],['social','Comfortable speaking up?',[['no','Not really'],['yes','Yes']]]];
function buildProgram(a){
 const p=[];const wt=a.water==='lt1'?2:a.water==='1to2'?2.5:3,ex=a.ex==='never'?15:a.ex==='some'?30:45,sc=a.screen==='6p'?5:a.screen==='3to6'?3:2;
 p.push({icon:'night-sleep',name:a.sleep==='lt6'?'Sleep 7 hours':'Lights out by 11pm',cat:'Discipline',target:1,unit:'',diff:'med'});
 p.push({icon:'water-drop',name:'Drink water',cat:'Strength',target:wt,unit:'L',diff:'easy'});
 p.push({icon:'run',name:'Exercise',cat:'Strength',target:ex,unit:'min',diff:ex>=45?'hard':'med'});
 p.push({icon:'meditation',name:'Meditate',cat:'Focus',target:a.mind==='no'?5:10,unit:'min',diff:'easy'});
 p.push({icon:'smartphone',name:'Screen time under '+sc+'h',cat:'Focus',target:1,unit:'',diff:'hard'});
 p.push({icon:'shower',name:'Cold shower',cat:'Discipline',target:1,unit:'',diff:'med'});
 p.push({icon:'open-book',name:'Read',cat:'Wisdom',target:10,unit:'pages',diff:'easy'});
 p.push({icon:'quill-ink',name:'Journal',cat:'Wisdom',target:1,unit:'',diff:'easy'});
 p.push({icon:'crown',name:'Speak up once today',cat:'Confidence',target:1,unit:'',diff:'med'});
 return p.map(x=>Object.assign({id:uid(),time:''},x));
}
function assess(a){const sc=v=>Math.max(1,Math.min(5,v));return{Strength:sc((a.ex==='often'?4:a.ex==='some'?3:1)+(a.water==='2p'?1:0)),Wisdom:a.read==='yes'?4:2,Confidence:a.social==='yes'?4:2,Discipline:sc(a.sleep==='7p'?4:a.sleep==='6to7'?3:2),Focus:sc((a.screen==='lt3'?3:a.screen==='3to6'?2:1)+(a.mind==='yes'?2:0))}}
function onboard(){
 if(ob.step===0)return `<div class="px hl" style="margin-top:30px;text-align:center"><div class="bounce">${hero('Discipline',80)}</div><h1 style="margin:18px 0;font-size:34px;background:linear-gradient(135deg,#fff,#a99bff 60%,#3fa9ff);-webkit-background-clip:text;background-clip:text;color:transparent">Ascend 66</h1><p class="mut">Turn your real goals into daily quests, XP and streaks. A free, offline 66-day life reset. No subscription. No account. No ads.</p><input id="nm" placeholder="Hero name" value="${esc(S.name)}"><br><button class="btn full" data-act="ob0">BEGIN</button></div>`;
 if(ob.step===1){const q=QUIZ.find(x=>!ob.a[x[0]]);if(!q){ob.step=2;return onboard()}const n=Object.keys(ob.a).length;return `<div class="px hl" style="margin-top:20px"><div class="pf mut">QUESTION ${n+1}/${QUIZ.length}</div>${bar(n/QUIZ.length*100,'var(--acc)')}<h2 style="margin:14px 0">${q[1]}</h2>${q[2].map(o=>`<button class="btn g full" data-act="oa" data-k="${q[0]}" data-v="${o[0]}" style="display:block;margin-bottom:10px">${o[1]}</button>`).join('')}</div>`}
 if(ob.step===2){const sc=assess(ob.a),w=Object.keys(sc).sort((x,y)=>sc[x]-sc[y])[0],s=Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0];return `<div class="px hl" style="margin-top:20px"><h2>Your assessment</h2><br>${Object.keys(sc).map(c=>`<div class="row sp"><span class="row">${ic(CATS[c].ic,20,'color:'+CATS[c].col)} ${c}</span><span class="pf">${sc[c]}/5</span></div>${bar(sc[c]*20,CATS[c].col)}`).join('')}<p>Strength: <b class="grn">${s}</b> · Blind spot: <b class="red">${w}</b></p><button class="btn full" data-act="ob2">BUILD MY 66-DAY PROGRAM</button></div>`}
 ob.prog=ob.prog.length?ob.prog:buildProgram(ob.a);if(!ob.sel.length&&!ob.touched)ob.sel=ob.prog.slice(0,6).map(p=>p.id);
 return `<div class="px hl" style="margin-top:20px"><h2>Your 66-day program</h2><p class="mut">Tap to choose your daily quests (edit targets later in Settings).</p>${ob.prog.map(p=>`<div class="quest ${ob.sel.includes(p.id)?'done':''}" style="--cc:${CATS[p.cat].col};--dc:${DIFF[p.diff].col}" data-act="osel" data-v="${p.id}"><span class="bd"></span><span class="icb">${ic(p.icon,26)}</span><div style="flex:1"><div class="nm">${esc(p.name)}${isBool(p)?'':' · '+p.target+' '+p.unit}</div><div class="mut">${p.cat} · ${DIFF[p.diff].n}</div></div><span class="chk">${ob.sel.includes(p.id)?'✓':''}</span></div>`).join('')}<label class="row" style="margin:12px 0"><input type="checkbox" id="hm" style="width:auto"><span><b class="red">Hard Mode</b>: missing a day restarts Day 1</span></label><button class="btn full" data-act="obgo">START MY 66 DAYS</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,v=el.dataset.v,k=dk();
 if(a==='ob0'){S.name=($('#nm').value||'').trim();ob.step=1}
 else if(a==='oa'){ob.a[el.dataset.k]=v}
 else if(a==='ob2'){ob.step=3}
 else if(a==='osel'){ob.touched=1;ob.sel=ob.sel.includes(v)?ob.sel.filter(x=>x!==v):[...ob.sel,v]}
 else if(a==='obgo'){if(!ob.sel.length){toast('PICK AT LEAST ONE QUEST');return}S.habits=ob.prog.filter(p=>ob.sel.includes(p.id));S.hard=$('#hm').checked;S.start=dk();S.checked=dk();S.onboarded=true;S.lastCard=dk();{const cs=Object.keys(CARDS),c=cs[Math.floor(Math.random()*cs.length)];modal=cardModal(c,CARDS[c][Math.floor(Math.random()*CARDS[c].length)])}sched()}
 else if(a==='tab'){S.tab=v;S.tool='';S.sub='';modal=''}
 else if(a==='tool'){if(v==='lock'){modal=`<div class="modal"><div class="px hl"><h3>Screen blocker</h3><p class="mut">Lock this screen for a set time. Finish for +1 XP per minute.</p>${[15,30,60].map(m=>`<button class="btn full" data-act="lockgo" data-v="${m}">${m} MINUTES</button>`).join('')}<button class="btn g full" data-act="mclose">CANCEL</button></div></div>`}else S.tool=v}
 else if(a==='sub'){S.sub=v}
 else if(a==='q'){const h=hab(v);if(isBool(h)){setAmt(v,isDone(k,h)?0:1)}else{modal=sheetHTML(h)}}
 else if(a==='pen'){S.penalty=false;gainXP(10);toast('PENALTY CLEARED +10 XP')}
 else if(a==='mclose'){modal=''}
 else if(a==='amtstep'){const i=$('#amt');i.value=Math.max(0,(+i.value||0)+ +v);return}
 else if(a==='amtdone'){modal='';setAmt(v,hab(v).target)}
 else if(a==='amtsave'){const x=+$('#amt').value||0;modal='';setAmt(v,x)}
 else if(a==='stuck'){const h=hab(v);modal=`<div class="modal"><div class="px hl"><h3>STUCK ON A HABIT?</h3><br>${TIPS.map(t=>`<p>• ${t}</p>`).join('')}<button class="btn y full" data-act="easier" data-v="${v}">MAKE IT EASIER (HALVE TARGET)</button><button class="btn g full" data-act="mclose">CLOSE</button></div></div>`}
 else if(a==='easier'){const h=hab(v);if(h.target>1)h.target=Math.max(1,Math.round(h.target/2*10)/10);toast('TARGET LOWERED');modal=''}
 else if(a==='extend'){S.span+=66;toast('PROGRAM EXTENDED +66 DAYS')}
 else if(a==='draw'){const cs=Object.keys(CARDS),c=cs[Math.floor(Math.random()*cs.length)],q=CARDS[c][Math.floor(Math.random()*CARDS[c].length)];modal=cardModal(c,q)}
 else if(a==='collect'){const c=el.dataset.c,q=el.dataset.q;if(!S.cards.some(x=>x.q===q))S.cards.push({c,q});modal='';toast('CARD COLLECTED')}
 else if(a==='tmins'){if(tState.run)return;tState.mins=+v;tState.left=+v*60}
 else if(a==='tgo'){if(tState.run){tState.run=false;clearInterval(timer)}else{tState.run=true;tState.end=Date.now()+tState.left*1000;timer=setInterval(tick,500)}}
 else if(a==='trst'){tState.run=false;clearInterval(timer);tState.left=tState.mins*60}
 else if(a==='bgo'){breath={left:+v*60,m:+v,t:0};bloop()}
 else if(a==='bstop'){clearInterval(breath.iv);breath=null}
 else if(a==='lockgo'){modal='';lockStart(+v);return}
 else if(a==='lockend'){clearInterval(lock.iv);lock=null;const o=$('#lockov');o&&o.remove()}
 else if(a==='wstart'){wk={id:v,done:{}}}
 else if(a==='wset'){wk.done[v]=!wk.done[v]}
 else if(a==='wcancel'){wk=null}
 else if(a==='wfin'){const r=S.routines.find(x=>x.id===wk.id),n=Object.values(wk.done).filter(Boolean).length;wk=null;S.counts.wk++;gainXP(30);S.attr.Strength+=30;S.wlog.push({d:k,r:r.name,sets:n});toast('WORKOUT DONE +30 XP')}
 else if(a==='wdel'){S.routines=S.routines.filter(r=>r.id!==v)}
 else if(a==='wmove'){const n=$('#mn').value.trim(),s=+$('#ms').value||3;if(n){newMoves.push({n,s});$('#mn').value='';$('#rmoves').textContent=newMoves.map(m=>m.n+' ×'+m.s).join(', ')}return}
 else if(a==='wsave'){const n=$('#rn').value.trim();if(!n||!newMoves.length){toast('NAME + ADD MOVES');return}S.routines.push({id:uid(),name:n,moves:newMoves});newMoves=[]}
 else if(a==='cadd'){const n=$('#cn').value.trim(),c=+$('#ck').value;if(!n||!c)return;(S.cal[k]=S.cal[k]||[]).push({n,k:c})}
 else if(a==='cdel'){S.cal[k].splice(+v,1)}
 else if(a==='badd'){const t=$('#bt1').value.trim();if(!t)return;S.books.unshift({t,n:$('#bn').value.trim()});gainXP(5);S.attr.Wisdom+=5}
 else if(a==='bdel'){S.books.splice(+v,1)}
 else if(a==='jsave'){const t=$('#jt').value.trim(),had=!!S.journal[k];S.journal[k]=t;if(t&&!had){gainXP(5);S.attr.Wisdom+=5;toast('JOURNAL SAVED +5 XP')}}
 else if(a==='buy'){const s=SHOP.find(x=>x.id===v);if(S.coins<s.p){toast('NOT ENOUGH COINS');return}S.coins-=s.p;if(v==='freeze')S.freezes++;else S.owned[v]=1;toast('PURCHASED')}
 else if(a==='equip'){const s=SHOP.find(x=>x.id===v),n=s.n.replace('Title: ','');S.title=S.title===n?'':n}
 else if(a==='hnew'){edit={id:'',icon:'sun',name:'',cat:'Discipline',target:1,unit:'',diff:'med',time:''};modal=editHTML();save();render();return}
 else if(a==='hedit'){edit=Object.assign({},hab(v));modal=editHTML();save();render();return}
 else if(a==='epick'){syncEdit();edit.icon=v;modal=editHTML();render();return}
 else if(a==='esave'){syncEdit();if(!edit.name){toast('NAME REQUIRED');return}if(edit.id){Object.assign(hab(edit.id),edit)}else{edit.id=uid();S.habits.push(edit);const kk=dk();if(S.snap[kk])S.snap[kk].push(edit.id)}edit=null;modal=''}
 else if(a==='edel'){S.habits=S.habits.filter(h=>h.id!==edit.id);edit=null;modal=''}
 else if(a==='eclose'){edit=null;modal=''}
 else if(a==='sched'){sched().then(r=>toast(r==='ok'?'REMINDERS SET':r==='web'?'REMINDERS: ANDROID APP ONLY':'ALLOW NOTIFICATIONS IN SETTINGS'));return}
 else if(a==='copy'){const t=$('#ex');t.select();try{navigator.clipboard.writeText(t.value);toast('COPIED')}catch(x){}return}
 else if(a==='imp'){try{const o=JSON.parse($('#im').value);S=Object.assign(fresh(),o);toast('RESTORED')}catch(x){toast('INVALID BACKUP');return}}
 else if(a==='reset'){modal=`<div class="modal mid"><div class="px"><h3>ERASE EVERYTHING?</h3><p class="mut">This cannot be undone.</p><button class="btn r full" data-act="reset2">ERASE</button><button class="btn g full" data-act="mclose">CANCEL</button></div></div>`}
 else if(a==='reset2'){S=fresh();ob={step:0,a:{},sel:[],prog:[]};modal=''}
 checkAch();save();render();
});
function syncEdit(){if(!edit)return;edit.name=$('#en').value.trim();edit.target=+$('#et').value||1;edit.unit=$('#eu').value.trim();edit.cat=$('#ec').value;edit.diff=$('#ed').value;edit.time=$('#etm').value}
document.addEventListener('change',e=>{
 const el=e.target,c=el.dataset.ch;if(!c)return;
 if(c==='cgoal')S.calGoal=+el.value||2200;else if(c==='sname')S.name=el.value.trim();else if(c==='hard')S.hard=el.checked;else if(c==='rem')S.remind.on=el.checked;else if(c==='remt')S.remind.time=el.value||'08:00';
 save();if(c==='cgoal')render();
});
function cardModal(c,q){return `<div class="modal mid"><div class="px hl pop" style="text-align:center">${ic(CATS[c].ic,56,'color:'+CATS[c].col)}<div class="pf" style="color:${CATS[c].col};margin:12px 0">${c.toUpperCase()}</div><p style="font-size:18px;line-height:1.5">${esc(q)}</p><button class="btn full" data-act="collect" data-c="${c}" data-q="${esc(q)}">COLLECT CARD</button><button class="btn g full" data-act="mclose">CLOSE</button></div></div>`}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){processDays();render()}});
if(S.onboarded&&S.lastCard!==dk()){S.lastCard=dk();const cs=Object.keys(CARDS),c=cs[Math.floor(Math.random()*cs.length)];modal=cardModal(c,CARDS[c][Math.floor(Math.random()*CARDS[c].length)]);save()}
try{if('serviceWorker' in navigator&&!window.Capacitor&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();
</script>
</body>
